<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Aayush Dubey — Cloud, AI, Data, Systems</title>
  <desc id="desc">Animated technical profile header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#101d3a"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#b57aff"/>
      <stop offset="1" stop-color="#56d8c0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="orb"><stop offset="0" stop-color="#9f7aea" stop-opacity=".45"/><stop offset="1" stop-color="#9f7aea" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="970" cy="90" r="150" fill="url(#orb)">
    <animate attributeName="cx" values="970;1030;970" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;135;90" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="145" r="78" fill="none" stroke="#58a6ff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="0 1020 145" to="360 1020 145" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="145" r="48" fill="none" stroke="#b57aff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 8">
    <animateTransform attributeName="transform" type="rotate" from="360 1020 145" to="0 1020 145" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="145" r="6" fill="#56d8c0" filter="url(#glow)">
    <animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <g fill="#58a6ff" opacity=".65">
    <circle cx="860" cy="55" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="55" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1135" cy="210" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="205" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="70" y="92" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">AAYUSH DUBEY</text>
  <text x="72" y="130" fill="#9fb3cf" font-family="JetBrains Mono,Consolas,monospace" font-size="18">CLOUD × AI × DATA × SYSTEMS</text>
  <rect x="72" y="154" width="430" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="80;430;80" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="196" fill="#dbe7f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Building production-minded software systems</text>
  <text x="72" y="225" fill="#8ea4c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Cloud engineering · AI automation · data · full-stack systems</text>
  <g font-family="JetBrains Mono,Consolas,monospace" font-size="12" fill="#7f9abc">
    <text x="820" y="242">BUILD</text><text x="870" y="242">→</text><text x="895" y="242">TEST</text><text x="945" y="242">→</text><text x="970" y="242">DEPLOY</text><text x="1040" y="242">→</text><text x="1065" y="242">ITERATE</text>
  </g>
</svg>
